services:
  - type: web
    name: tebra-mcp-server
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: TEBRA_CLIENT_ID
        sync: false
      - key: TEBRA_CLIENT_SECRET
        sync: false
      - key: TEBRA_SCOPE
        sync: false
      - key: MCP_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: "3000"
